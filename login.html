<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeNest | Client Portal Login</title>
  <meta name="description" content="Sign in to your ForgeNest client portal to track residential metalwork orders, review blueprints, and manage consultations.">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-body">

  <!-- Top Controls Bar (Dark Mode & RTL / LTR only - No Back button) -->
  <header class="auth-top-bar" aria-label="Display Controls">
    <button type="button" class="icon-btn theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn rtl-toggle-btn" aria-label="Toggle RTL/LTR layout" title="Toggle RTL/LTR layout">
      <span class="rtl-label" style="font-weight:700;font-size:0.75rem;">RTL</span>
    </button>
  </header>

  <!-- Centered Login Card Container -->
  <main class="auth-main-container">
    <div class="auth-card">
      
      <!-- Card Header -->
      <div class="auth-header">
        <a href="index.html" class="auth-logo" aria-label="ForgeNest Home">
          <img src="assets/images/logo/logo.svg" alt="ForgeNest Logo" class="logo-light" width="140" height="35">
          <img src="assets/images/logo/logo-dark.svg" alt="ForgeNest Dark Logo" class="logo-dark" width="140" height="35">
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
          Sign in to access your residential metalwork portal, track fabrication milestones, view CAD blueprints &amp; manage site consultations.
        </p>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm" onsubmit="event.preventDefault(); alert('Login successful! Redirecting to dashboard...'); window.location.href='index.html';">
        
        <div class="auth-form-group">
          <label class="auth-label" for="login-username">Username or Email Address</label>
          <input 
            type="text" 
            id="login-username" 
            class="auth-input" 
            placeholder="Enter your email or client ID..." 
            required 
            autocomplete="username"
          >
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="login-password">Password</label>
          <div class="auth-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="auth-input" 
              placeholder="Enter your password..." 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" title="Show password">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="auth-checkbox-label" for="remember-me">
            <input type="checkbox" id="remember-me" name="remember" checked>
            <span>Remember me for 30 days</span>
          </label>
          <a href="#" class="auth-forgot-link" onclick="alert('Password reset instructions have been sent to your registered email.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-auth-submit">
          <i class="bi bi-lock-fill" aria-hidden="true"></i>
          <span>Log In To Account</span>
        </button>

        <div class="auth-divider">
          <span>Or continue with</span>
        </div>

        <div class="social-auth-grid">
          <!-- Google -->
          <button type="button" class="social-auth-btn" aria-label="Sign in with Google" title="Sign in with Google" onclick="alert('Google authentication service connected.');">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
          </button>
          
          <!-- Facebook -->
          <button type="button" class="social-auth-btn" aria-label="Sign in with Facebook" title="Sign in with Facebook" onclick="alert('Facebook authentication service connected.');">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>

          <!-- Apple -->
          <button type="button" class="social-auth-btn" aria-label="Sign in with Apple" title="Sign in with Apple" onclick="alert('Apple authentication service connected.');">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.65-.79 1.09-1.89.97-2.99-.95.04-2.1.64-2.77 1.43-.59.68-1.11 1.79-.97 2.87 1.06.08 2.14-.54 2.77-1.31"/>
            </svg>
          </button>
        </div>

        <div class="auth-footer">
          <span>Don't have an account?</span>
          <a href="register.html" class="auth-switch-link">Create New Account</a>
        </div>

      </form>

    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    // Password visibility toggle handler
    document.querySelectorAll('.password-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye-slash';
          btn.setAttribute('title', 'Hide password');
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye';
          btn.setAttribute('title', 'Show password');
        }
      });
    });
  </script>
</body>
</html>
