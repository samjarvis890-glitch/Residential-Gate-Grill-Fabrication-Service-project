<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FAF8F5"/><stop offset="100%" stop-color="#E9E4DC"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#prBg)"/>
  <!-- Architectural Blueprint Grid Paper -->
  <g stroke="#D8D2C6" stroke-width="1">
    <line x1="50" y1="50" x2="550" y2="50"/><line x1="50" y1="90" x2="550" y2="90"/><line x1="50" y1="130" x2="550" y2="130"/><line x1="50" y1="170" x2="550" y2="170"/><line x1="50" y1="210" x2="550" y2="210"/><line x1="50" y1="250" x2="550" y2="250"/><line x1="50" y1="290" x2="550" y2="290"/><line x1="50" y1="330" x2="550" y2="330"/>
    <line x1="90" y1="50" x2="90" y2="350"/><line x1="170" y1="50" x2="170" y2="350"/><line x1="250" y1="50" x2="250" y2="350"/><line x1="330" y1="50" x2="330" y2="350"/><line x1="410" y1="50" x2="410" y2="350"/><line x1="490" y1="50" x2="490" y2="350"/>
  </g>
  <!-- Architectural Elevation Drawing of Gate & Dimension Callouts -->
  <rect x="120" y="100" width="360" height="180" rx="3" fill="#FFFFFF" stroke="#202124" stroke-width="4"/>
  <line x1="120" y1="190" x2="480" y2="190" stroke="#202124" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="280" stroke="#202124" stroke-width="3"/>
  <!-- Dimension Arrows & Copper Annotations -->
  <line x1="120" y1="75" x2="480" y2="75" stroke="#B47A45" stroke-width="2"/>
  <polygon points="120,75 130,71 130,79" fill="#B47A45"/>
  <polygon points="480,75 470,71 470,79" fill="#B47A45"/>
  <text x="300" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#B47A45" text-anchor="middle">WIDTH : 14 FT</text>
  
  <line x1="505" y1="100" x2="505" y2="280" stroke="#B47A45" stroke-width="2"/>
  <polygon points="505,100 501,110 509,110" fill="#B47A45"/>
  <polygon points="505,280 501,270 509,270" fill="#B47A45"/>
  <text x="535" y="195" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#B47A45" text-anchor="middle">6.5 FT</text>
</svg>
