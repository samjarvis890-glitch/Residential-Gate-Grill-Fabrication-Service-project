<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F5F3EF"/><stop offset="100%" stop-color="#E2DDD5"/></linearGradient>
    <linearGradient id="cop" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C98B50"/><stop offset="100%" stop-color="#9E6735"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgG)"/>
  <!-- Villa Gate Structure -->
  <rect x="60" y="80" width="480" height="240" rx="4" fill="#202124"/>
  <rect x="75" y="95" width="450" height="210" fill="#17191B"/>
  <!-- Vertical Balanced Fins -->
  <g fill="#2C2F33">
    <rect x="95" y="110" width="12" height="180"/>
    <rect x="125" y="110" width="12" height="180"/>
    <rect x="155" y="110" width="12" height="180"/>
    <rect x="185" y="110" width="12" height="180"/>
    <rect x="215" y="110" width="12" height="180"/>
    <rect x="245" y="110" width="12" height="180"/>
    <rect x="275" y="110" width="12" height="180"/>
  </g>
  <!-- Modern Geometric Offset Panel on Right -->
  <rect x="315" y="110" width="190" height="180" fill="#26282B"/>
  <line x1="330" y1="140" x2="485" y2="140" stroke="url(#cop)" stroke-width="4"/>
  <line x1="330" y1="200" x2="485" y2="200" stroke="url(#cop)" stroke-width="4"/>
  <line x1="330" y1="260" x2="485" y2="260" stroke="url(#cop)" stroke-width="4"/>
  <circle cx="450" cy="200" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Driveway Base -->
  <rect x="0" y="320" width="600" height="80" fill="#CCC5BA"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#B8B0A2" stroke-width="2"/>
</svg>
