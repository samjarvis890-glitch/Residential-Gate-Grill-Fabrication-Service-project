<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F2EFE9"/><stop offset="100%" stop-color="#DDD7CD"/></linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.8"/><stop offset="100%" stop-color="#CBE5EE" stop-opacity="0.6"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#rBg)"/>
  <!-- Balcony Deck Floor -->
  <polygon points="40,280 560,280 520,380 0,380" fill="#202124"/>
  <!-- Balcony Glass Balustrade Panels -->
  <rect x="60" y="100" width="130" height="180" rx="2" fill="url(#glass)" stroke="#B0C4DE" stroke-width="1.5"/>
  <rect x="200" y="100" width="130" height="180" rx="2" fill="url(#glass)" stroke="#B0C4DE" stroke-width="1.5"/>
  <rect x="340" y="100" width="130" height="180" rx="2" fill="url(#glass)" stroke="#B0C4DE" stroke-width="1.5"/>
  <!-- Continuous Stainless Steel Handrail -->
  <rect x="50" y="90" width="430" height="12" rx="3" fill="#A8ADB4"/>
  <!-- Stainless Steel Spigots & Support Posts -->
  <rect x="115" y="270" width="18" height="25" fill="#34373A"/>
  <rect x="255" y="270" width="18" height="25" fill="#34373A"/>
  <rect x="395" y="270" width="18" height="25" fill="#34373A"/>
  <!-- Warm Copper Architectural Accent -->
  <rect x="50" y="102" width="430" height="4" fill="#B47A45"/>
</svg>
