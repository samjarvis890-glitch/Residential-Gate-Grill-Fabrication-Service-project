<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#EBE8E1"/><stop offset="100%" stop-color="#D5CFC4"/></linearGradient>
    <linearGradient id="msG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2D3033"/><stop offset="100%" stop-color="#191B1D"/></linearGradient>
    <linearGradient id="ssG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0F2F5"/><stop offset="50%" stop-color="#CCD2D9"/><stop offset="100%" stop-color="#9AA0A6"/></linearGradient>
    <linearGradient id="aluG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#73767A"/><stop offset="100%" stop-color="#4E5155"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mBg)"/>
  <!-- Material Sample Specimen 1: MS Powder Coated -->
  <g transform="translate(60, 70)">
    <rect width="130" height="240" rx="6" fill="url(#msG)"/>
    <text x="65" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">MILD STEEL</text>
    <rect x="25" y="30" width="80" height="6" fill="#B47A45" rx="3"/>
  </g>
  <!-- Material Sample Specimen 2: SS Brushed 304 -->
  <g transform="translate(235, 70)">
    <rect width="130" height="240" rx="6" fill="url(#ssG)"/>
    <!-- Brushed texture lines -->
    <line x1="15" y1="40" x2="115" y2="40" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="80" x2="115" y2="80" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="120" x2="115" y2="120" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="160" x2="115" y2="160" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="200" x2="115" y2="200" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <text x="65" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">SS 304 / 316</text>
  </g>
  <!-- Material Sample Specimen 3: Architectural Aluminum -->
  <g transform="translate(410, 70)">
    <rect width="130" height="240" rx="6" fill="url(#aluG)"/>
    <rect x="20" y="30" width="90" height="180" fill="none" stroke="#9AA0A6" stroke-width="2"/>
    <text x="65" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">ALUMINIUM</text>
  </g>
</svg>
