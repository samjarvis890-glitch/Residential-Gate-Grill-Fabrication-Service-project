    <line x1="20" y1="20" x2="20" y2="44" stroke="#B47A45" stroke-width="2" />
    <line x1="28" y1="20" x2="28" y2="44" stroke="#B47A45" stroke-width="2" />
    <line x1="34" y1="20" x2="34" y2="44" stroke="#F7F5F1" stroke-width="1.8" />
    
